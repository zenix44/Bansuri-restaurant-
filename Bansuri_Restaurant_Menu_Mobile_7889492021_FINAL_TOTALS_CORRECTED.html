<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bansuri Restaurant — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0b09;
    --surface:#161310;
    --surface-2:#1d1914;
    --hairline:#332c22;
    --gold:#c9a227;
    --gold-light:#e8cd7a;
    --teal:#1c6e60;
    --maroon:#7d2230;
    --cream:#f4ecdc;
    --muted:#a89a7c;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--cream);
    font-family:'Mulish',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:56px;
  }
  ::selection{background:var(--gold);color:#1a1509;}

  /* feather texture backdrop */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 700px 400px at 15% -5%, rgba(28,110,96,0.16), transparent 60%),
      radial-gradient(ellipse 600px 500px at 110% 10%, rgba(201,162,39,0.10), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  header.hero{
    position:relative;
    text-align:center;
    padding:34px 20px 26px;
    border-bottom:1px solid var(--hairline);
    z-index:1;
  }
  .logo-wrap{
    width:112px;height:112px;
    margin:0 auto 14px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid rgba(201,162,39,0.55);
    box-shadow:0 0 0 5px rgba(201,162,39,0.07), 0 8px 24px rgba(0,0,0,0.5);
  }
  .logo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  h1.brand{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:2.6rem;
    letter-spacing:0.02em;
    margin:0;
    color:var(--gold-light);
    line-height:1.05;
  }
  p.tagline{
    margin:8px 0 0;
    font-size:0.78rem;
    letter-spacing:0.16em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .feather-rule{
    width:64px;height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:16px auto 0;
  }

  /* search */
  .search-bar{
    position:sticky; top:0; z-index:20;
    background:rgba(12,11,9,0.96);
    backdrop-filter:blur(6px);
    padding:12px 16px 10px;
    border-bottom:1px solid var(--hairline);
  }
  .search-bar input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--hairline);
    color:var(--cream);
    font-family:'Mulish',sans-serif;
    font-size:0.95rem;
    padding:11px 14px;
    border-radius:8px;
    outline:none;
  }
  .search-bar input::placeholder{color:var(--muted);}
  .search-bar input:focus{border-color:var(--gold);}

  nav.pills{
    position:sticky; top:53px; z-index:19;
    display:flex; gap:8px;
    overflow-x:auto;
    padding:10px 16px 12px;
    background:rgba(12,11,9,0.96);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--hairline);
    scrollbar-width:none;
  }
  nav.pills::-webkit-scrollbar{display:none;}
  nav.pills button{
    flex:0 0 auto;
    background:var(--surface);
    border:1px solid var(--hairline);
    color:var(--muted);
    font-family:'Mulish',sans-serif;
    font-weight:600;
    font-size:0.78rem;
    letter-spacing:0.02em;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  nav.pills button.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#1a1509;
  }

  main{
    position:relative; z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:8px 16px 20px;
  }

  section.cat{
    margin-top:30px;
    scroll-margin-top:112px;
  }
  .cat-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .cat-head h2{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-style:italic;
    font-size:1.55rem;
    color:var(--gold-light);
    margin:0;
  }
  .cat-head .count{
    font-size:0.72rem;
    color:var(--muted);
  }
  .cat-divider{
    height:1px;
    background:linear-gradient(90deg, var(--gold) 0%, var(--hairline) 40%);
    margin:6px 0 14px;
  }

  ul.items{list-style:none;margin:0;padding:0;}
  li.item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:9px 0;
    border-bottom:1px dashed var(--hairline);
  }
  li.item:last-child{border-bottom:none;}
  .dot{
    flex:0 0 auto;
    width:9px;height:9px;
    border-radius:2px;
    margin-right:2px;
    align-self:center;
  }
  .dot.veg{border:1.5px solid #4f9d5c;background:transparent;}
  .dot.nonveg{border:1.5px solid var(--maroon);background:var(--maroon);}
  .item-name{
    font-size:0.94rem;
    font-weight:500;
    color:var(--cream);
    flex:0 0 auto;
  }
  .leader{
    flex:1 1 auto;
    border-bottom:1px dotted var(--hairline);
    margin-bottom:4px;
    min-width:16px;
  }
  .item-price{
    flex:0 0 auto;
    font-weight:700;
    font-size:0.92rem;
    color:var(--gold-light);
    white-space:nowrap;
  }

  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-style:italic;
    font-family:'Cormorant Garamond',serif;
    font-size:1.2rem;
  }

  footer{
    text-align:center;
    padding:30px 20px 10px;
    color:var(--muted);
    font-size:0.75rem;
    letter-spacing:0.06em;
  }
  footer .note{
    color:var(--gold-light);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.1rem;
    margin-bottom:8px;
  }

  /* category icon */
  .cat-icon{
    width:22px;height:22px;
    flex:0 0 auto;
    color:var(--gold);
  }
  .cat-icon svg{width:100%;height:100%;display:block;}

  /* spice + special badges */
  .spice{
    font-size:0.72rem;
    margin-left:2px;
    filter:saturate(1.1);
  }
  .badge-special{
    display:inline-block;
    font-family:'Mulish',sans-serif;
    font-size:0.62rem;
    font-weight:800;
    letter-spacing:0.05em;
    color:#1a1509;
    background:linear-gradient(90deg, var(--gold-light), var(--gold));
    padding:2px 7px;
    border-radius:4px;
    margin-left:8px;
    vertical-align:middle;
    white-space:nowrap;
  }

  /* scroll reveal */
  section.cat{opacity:0; transform:translateY(14px);}
  section.cat.in-view{
    animation:catIn .5s ease forwards;
  }
  @keyframes catIn{
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    section.cat{opacity:1; transform:none; animation:none;}
  }

  /* floating action buttons */
  .fab-group{
    position:fixed;
    right:16px; bottom:16px;
    z-index:30;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .fab{
    width:50px;height:50px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    box-shadow:0 6px 18px rgba(0,0,0,0.5);
    border:1px solid rgba(201,162,39,0.4);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .fab:active{transform:scale(0.93);}
  .fab-call{
    background:linear-gradient(160deg, var(--gold-light), var(--gold));
    color:#1a1509;
  }
  .fab-call svg{width:22px;height:22px;}
  .fab-top{
    background:var(--surface);
    color:var(--gold-light);
    opacity:0;
    pointer-events:none;
    transform:translateY(8px);
  }
  .fab-top.show{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }
  .fab-top svg{width:20px;height:20px;}

  .fab-share{
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    color:var(--teal);
    border:1px solid rgba(28,110,96,0.55);
  }
  .fab-share svg{width:21px;height:21px;}

  .toast{
    position:fixed;
    left:50%; bottom:24px;
    transform:translate(-50%, 12px);
    background:var(--gold-light);
    color:#1a1509;
    font-weight:700;
    font-size:0.82rem;
    padding:10px 18px;
    border-radius:999px;
    box-shadow:0 8px 22px rgba(0,0,0,0.4);
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:40;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }



  /* Veg / Non-Veg filter */
  .food-filter{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:12px 16px 16px;}
  .food-filter button{border:1px solid var(--hairline);background:var(--surface);color:var(--cream);padding:8px 14px;border-radius:999px;font-weight:800;cursor:pointer;}
  .food-filter button.active{background:var(--gold);color:#1a1509;border-color:var(--gold);}

  /* stats row */
  .stats-row{
    display:flex;
    justify-content:center;
    gap:22px;
    margin:14px auto 0;
    flex-wrap:wrap;
  }
  .stats-row .stat{text-align:center;}
  .stats-row .stat b{
    display:block;
    font-family:'Cormorant Garamond',serif;
    font-size:1.5rem;
    color:var(--gold-light);
    line-height:1;
  }
  .stats-row .stat span{
    font-size:0.65rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* Chef's Picks strip */
  .picks-strip{
    max-width:608px;
    margin:18px auto 4px;
    padding:0 16px;
  }
  .picks-strip .picks-label{
    font-size:0.6rem;
    letter-spacing:0.14em;
    color:var(--gold);
    font-weight:800;
    margin-bottom:8px;
  }
  .picks-row{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .picks-row::-webkit-scrollbar{display:none;}
  .pick-chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(135deg, rgba(201,162,39,0.14), rgba(28,110,96,0.10));
    border:1px solid rgba(201,162,39,0.4);
    border-radius:999px;
    padding:8px 14px 8px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .pick-chip:active{transform:scale(0.97);}
  .pick-chip .pick-icon{width:18px;height:18px;color:var(--gold);flex:0 0 auto;}
  .pick-chip .pick-icon svg{width:100%;height:100%;}
  .pick-chip .pick-name{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1rem;
    color:var(--cream);
  }

  .item.flash{animation:itemFlash 1.4s ease; border-radius:6px;}
  @keyframes itemFlash{
    0%{background:rgba(201,162,39,0.35);}
    100%{background:transparent;}
  }

  /* Chef artwork showcase */
  .chef-showcase{
    max-width:620px;
    margin:8px auto 8px;
    padding:0 14px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    position:relative;
    z-index:1;
  }
  .chef-card{
    height:150px;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--hairline);
    background:#fff;
    box-shadow:0 8px 22px rgba(0,0,0,.28);
  }
  .chef-card img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    background:#fff;
  }
  @media(max-width:520px){
    .chef-showcase{gap:7px;padding:0 10px;}
    .chef-card{height:118px;border-radius:12px;}
  }
  .chef-caption{
    text-align:center;
    color:var(--muted);
    font-size:.72rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin:8px 16px 0;
  }


  /* New premium restaurant palette + chef corner composition */
  :root{
    --bg:#102b25;
    --surface:#17372f;
    --surface-2:#1d4339;
    --hairline:#31584e;
    --gold:#d5a83a;
    --gold-light:#f1d58a;
    --cream:#f7f1e4;
    --muted:#b9b59f;
  }
  body{
    background:
      radial-gradient(ellipse 620px 420px at 50% -8%, rgba(213,168,58,.16), transparent 62%),
      linear-gradient(180deg,#12342d 0%,#102b25 42%,#0d2520 100%);
  }
  body::before{
    background:
      radial-gradient(ellipse 420px 300px at 0% 0%, rgba(213,168,58,.10), transparent 65%),
      radial-gradient(ellipse 420px 360px at 100% 5%, rgba(241,213,138,.08), transparent 65%);
  }
  header.hero{
    padding:28px 20px 18px;
    background:linear-gradient(180deg,rgba(8,27,23,.22),rgba(8,27,23,0));
    border-bottom:1px solid rgba(213,168,58,.22);
  }
  .logo-wrap{
    border-color:rgba(213,168,58,.72);
    box-shadow:0 0 0 5px rgba(213,168,58,.08),0 10px 28px rgba(0,0,0,.35);
  }
  .search-bar,nav.pills{background:rgba(13,37,32,.96);}
  .chef-stage{
    position:relative;
    max-width:640px;
    height:205px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:1;
    overflow:hidden;
  }
  .main-chef{
    width:185px;height:205px;
    position:relative;z-index:3;
    overflow:hidden;
    border-radius:22px 22px 0 0;
    background:rgba(247,241,228,.96);
    border:1px solid rgba(213,168,58,.48);
    box-shadow:0 10px 28px rgba(0,0,0,.30);
  }
  .main-chef img{width:100%;height:100%;display:block;object-fit:contain;}
  .corner-chef{
    position:absolute;
    bottom:0;
    width:118px;height:142px;
    z-index:2;
    overflow:hidden;
    border-radius:18px 18px 0 0;
    background:rgba(247,241,228,.94);
    border:1px solid rgba(213,168,58,.34);
    box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  .corner-chef img{width:100%;height:100%;display:block;object-fit:contain;}
  .corner-left{left:10px;transform:rotate(-4deg);}
  .corner-right{right:10px;transform:rotate(4deg);}
  .chef-caption{margin:7px 16px 2px;color:var(--gold-light);font-weight:700;}
  @media(max-width:520px){
    .chef-stage{height:175px;}
    .main-chef{width:150px;height:175px;border-radius:18px 18px 0 0;}
    .corner-chef{width:86px;height:112px;border-radius:14px 14px 0 0;}
    .corner-left{left:4px;}
    .corner-right{right:4px;}
  }

</style>
</head>

const NONVEG_WORDS = ["chicken","mutton","prawn","fish","egg","crab","seafood","pomfret","rohu","king prawn","king crab","chuna fish","pohala"];
function isNonVeg(name){
  const n = name.toLowerCase();
  return NONVEG_WORDS.some(w => n.includes(w));
}

const SPICE_WORDS = ["chilly","chilli","hot garlic","schezwan","tom yum","manchow","majestic","garlic hot","rain forest","sultan"];
function spiceLevel(name){
  const n = name.toLowerCase();
  let hits = SPICE_WORDS.filter(w => n.includes(w)).length;
  if(n.includes("chilly") && n.includes("boneless")) hits += 1; // extra-fiery combo
  return Math.min(hits, 3);
}

const SPECIAL_DISHES = ["bansuri special biryani","chicken dabba ghost","chicken roast masala","bamboo mutton","tandoori pomfret"];
function isSpecial(name){
  return SPECIAL_DISHES.includes(name.toLowerCase());
}

const CAT_ICON = {
  "Veg Starter":"leaf","Non-Veg Starter":"drumstick","Soup":"bowl","Noodles":"noodle",
  "Chinese Rice":"noodle","Indian Veg Curry":"pot","Indian Non-Veg Curry":"pot",
  "Special Mutton Curry":"drumstick","Biryani":"pot","Bamboo Special Poda":"flame",
  "Tandoor":"flame","Sea Food":"fish","Rice & Dal":"bowl","Egg":"egg",
  "Veg Thali":"thali","Non-Veg Thali":"thali","Bread":"wheat",
  "Salad, Papad & Drinks":"glass","Desserts":"dessert"
};

const root = document.getElementById('menuRoot');
const pillNav = document.getElementById('pillNav');
const searchInput = document.getElementById('searchInput');

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function render(filterText){
  root.innerHTML = '';
  const q = (filterText||'').trim().toLowerCase();
  let anyMatch = false;

  MENU.forEach(section => {
    const items = section.items.filter(([name]) => !q || name.toLowerCase().includes(q));
    if(items.length === 0) return;
    anyMatch = true;

    const sec = document.createElement('section');
    sec.className = 'cat';
    sec.id = 'cat-' + slug(section.cat);

    const iconKey = CAT_ICON[section.cat] || 'bowl';
    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `<span class="cat-icon">${ICONS[iconKey]}</span><h2>${section.cat}</h2><span class="count">${items.length} items</span>`;
    sec.appendChild(head);

    const divider = document.createElement('div');
    divider.className = 'cat-divider';
    sec.appendChild(divider);

    const ul = document.createElement('ul');
    ul.className = 'items';
    items.forEach(([name, price]) => {
      const li = document.createElement('li');
      li.className = 'item';
      li.id = 'item-' + slug(section.cat + '-' + name);
      const nonveg = isNonVeg(name);
      const spice = spiceLevel(name);
      const spiceHtml = spice > 0 ? `<span class="spice">${'🌶️'.repeat(spice)}</span>` : '';
      const specialHtml = isSpecial(name) ? `<span class="badge-special">Chef's Pick</span>` : '';
      const foodType = nonveg ? 'nonveg' : 'veg';
      li.dataset.foodType = foodType;
      const priceHtml = price === '—' ? '<span style="font-style:italic;color:var(--muted);font-weight:600;">Ask staff</span>' : `₹${price}`;
      li.innerHTML = `
        <span class="dot ${foodType}"></span>
        <span class="item-name">${name}${spiceHtml}${specialHtml}</span>
        <span class="leader"></span>
        <span class="item-price">${priceHtml}</span>
      `;
      ul.appendChild(li);
    });
    sec.appendChild(ul);
    root.appendChild(sec);
  });

  if(!anyMatch){
    root.innerHTML = '<div class="empty-state">No dish found. Try a different search.</div>';
  }
}

function buildPills(){
  pillNav.innerHTML = '';
  MENU.forEach((section, i) => {
    const btn = document.createElement('button');
    btn.textContent = section.cat;
    if(i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav.pills button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const target = document.getElementById('cat-' + slug(section.cat));
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
    pillNav.appendChild(btn);
  });
}

searchInput.addEventListener('input', (e) => render(e.target.value));

buildPills();
render('');

// Veg / Non-Veg filter
let activeFoodFilter = 'all';
function applyFoodFilter(){
  document.querySelectorAll('.item').forEach(item => {
    item.style.display = activeFoodFilter === 'all' || item.dataset.foodType === activeFoodFilter ? '' : 'none';
  });
}
document.querySelectorAll('[data-food-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFoodFilter = btn.dataset.foodFilter;
    document.querySelectorAll('[data-food-filter]').forEach(b => b.classList.toggle('active', b === btn));
    applyFoodFilter();
  });
});

// scroll reveal for category sections
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('in-view');
      revealObserver.unobserve(entry.target);
    }
  });
}, {threshold:0.08, rootMargin:"0px 0px -40px 0px"});

function observeSections(){
  document.querySelectorAll('section.cat').forEach(sec => revealObserver.observe(sec));
}
observeSections();

// re-observe whenever search filters and rebuilds the DOM
const origRender = render;
render = function(filterText){
  origRender(filterText);
  observeSections();
  applyFoodFilter();
};

  scrollTopBtn.classList.toggle('show', window.scrollY > 500);

// Chef's Picks strip
(function picksStrip(){
  const picks = [];
  MENU.forEach(section => section.items.forEach(([name]) => {
    if(isSpecial(name)) picks.push({name, cat:section.cat});
  }));
  if(picks.length === 0) return;

  const row = document.getElementById('picksRow');
  picks.forEach(pick => {
    const iconKey = CAT_ICON[pick.cat] || 'pot';
    const chip = document.createElement('div');
    chip.className = 'pick-chip';
    chip.innerHTML = `<span class="pick-icon">${ICONS[iconKey]}</span><span class="pick-name">${pick.name}</span>`;
    chip.addEventListener('click', () => {
      const target = document.getElementById('item-' + slug(pick.cat + '-' + pick.name));
      if(!target) return;
      target.scrollIntoView({behavior:'smooth', block:'center'});
      target.classList.remove('flash');
      void target.offsetWidth;
      target.classList.add('flash');
    });
    row.appendChild(chip);
  });
})();

// share button
const shareBtn = document.getElementById('shareBtn');
const toast = document.getElementById('toast');
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}
shareBtn.addEventListener('click', async () => {
  const shareData = {
    title: 'Bansuri Restaurant — Menu',
    text: 'Check out the menu at Bansuri Restaurant!',
    url: window.location.href
  };
  if(navigator.share){
    try { await navigator.share(shareData); } catch(e) { /* user cancelled */ }
  } else {
    try {
      await navigator.clipboard.writeText(window.location.href);
      showToast('Link copied — share it with friends!');
    } catch(e) {
      showToast('Copy this page\'s link to share it');
    }
  }
});
